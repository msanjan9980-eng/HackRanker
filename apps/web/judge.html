<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Judge view | Sample Hack 2026</title>
    <meta name="description" content="Your own judge scores for Sample Hack 2026. Only your own scores are visible.">
    <style>
      :root{
        --bg:#0b0b0c;--surface:#131315;--surface-2:#1a1a1d;
        --border:#242428;--border-strong:#34343a;
        --text:#ededef;--text-muted:#9a9aa0;--text-dim:#6a6a72;
        --accent:#3b82f6;
        --radius:6px;--radius-sm:4px;--transition:120ms ease;
      }
      *,*::before,*::after{box-sizing:border-box}
      html{-webkit-font-smoothing:antialiased;color-scheme:dark}
      body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:15px;line-height:1.55}
      a{color:var(--accent);text-decoration:none}
      a:hover{text-decoration:underline;text-underline-offset:2px}
      ::selection{background:rgba(59,130,246,0.25)}
      ::-webkit-scrollbar{width:10px}
      ::-webkit-scrollbar-track{background:var(--bg)}
      ::-webkit-scrollbar-thumb{background:#2a2a2e;border-radius:5px;border:2px solid var(--bg)}
      .shell{max-width:1000px;margin:0 auto;padding:0 32px}
      header{padding:48px 0 32px;border-bottom:1px solid var(--border)}
      .brand{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:500;color:var(--text-muted);margin-bottom:24px}
      .brand a{color:var(--text-muted);text-decoration:none}
      .brand a:hover{color:var(--text);text-decoration:underline;text-underline-offset:2px}
      .brand .dot{display:none}
      h1{font-size:28px;font-weight:600;letter-spacing:-0.02em;line-height:1.2;margin:0 0 10px;color:var(--text)}
      .subtitle{color:var(--text-muted);margin:0;font-size:15px;max-width:60ch}
      .subtitle code{background:var(--surface-2);border:1px solid var(--border);padding:1px 6px;border-radius:var(--radius-sm);font-size:0.88em;color:var(--text-muted);font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
      main{padding:32px 0 64px}
      .panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:24px;margin-bottom:16px}
      .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:16px;padding:24px}
      .kpi{display:flex;flex-direction:column;gap:6px;padding:12px 16px;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius-sm)}
      .kpi .label{font-size:12px;color:var(--text-dim);text-transform:uppercase;letter-spacing:0.08em;font-weight:500}
      .kpi .value{font-size:20px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--text)}
      .kpi .value.ok{color:var(--text)}
      table{width:100%;border-collapse:collapse;font-size:14px}
      th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--border)}
      th{color:var(--text-dim);font-weight:500;font-size:12px;text-transform:uppercase;letter-spacing:0.06em}
      tbody tr:last-child td{border-bottom:0}
      .num{text-align:right;font-variant-numeric:tabular-nums}
      .score{display:inline-block;padding:2px 8px;border-radius:var(--radius-sm);background:var(--surface-2);border:1px solid var(--border);color:var(--text);font-variant-numeric:tabular-nums;font-weight:500}
      .status{padding:16px 20px;border-radius:var(--radius);border:1px solid var(--border);background:var(--surface);font-size:14px;color:var(--text-muted)}
      .status.error,.status.denied{border-color:#5a2426;color:#f87171}
      .status.denied code{background:var(--surface-2);border-color:var(--border);color:#f87171}
      .spinner{display:inline-block;vertical-align:middle;width:12px;height:12px;border:1.5px solid #2a2a2e;border-top-color:var(--text-muted);border-radius:50%;animation:spin 700ms linear infinite;margin-right:8px}
      @keyframes spin{to{transform:rotate(360deg)}}
      footer{max-width:1000px;margin:0 auto;padding:32px;color:var(--text-dim);font-size:12px;border-top:1px solid var(--border);display:flex;flex-wrap:wrap;gap:12px;align-items:center}
      footer a{color:var(--text-muted);text-decoration:none}
      footer a:hover{color:var(--text);text-decoration:underline;text-underline-offset:2px}
      code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;background:var(--surface-2);border:1px solid var(--border);padding:1px 6px;border-radius:var(--radius-sm);font-size:0.88em;color:var(--text-muted)}
@media (max-width:640px){
.shell{padding-left:20px;padding-right:20px}
.hero-top{flex-direction:column;align-items:flex-start;gap:16px}
.nav-links{width:100%;flex-wrap:wrap}
.nav-link{flex:1 1 auto;justify-content:center}
.search{flex:1 1 100%}
.track-filter{flex:1 1 100%;min-width:0}
#gallery{grid-template-columns:1fr !important}
h1{font-size:24px}
main{padding:24px 0 48px}
}
    </style>
  </head>
  <body>
    <header>
      <div class="shell">
        <div class="brand"><a href="/">dogfood 2026</a> &middot; judge view</div>
        <h1 id="title">Your scores</h1>
        <p class="subtitle">Signed in via the <code style="background: rgba(122,162,255,0.1); padding: 0.05rem 0.35rem; border-radius: 5px;">df_sid</code> cookie. Only your own scores are visible.</p>
      </div>
    </header>

    <main class="shell">
      <div id="status" class="status"><span class="spinner"></span>Loading your scores&hellip;</div>
      <div id="content" style="display:none;">
        <div class="panel kpis">
          <div class="kpi"><span class="label">Your judge id</span><span class="value" id="judge-id">&mdash;</span></div>
          <div class="kpi"><span class="label">Scores submitted</span><span class="value" id="count">&mdash;</span></div>
          <div class="kpi"><span class="label">Average</span><span class="value" id="avg">&mdash;</span></div>
        </div>
        <div class="panel">
          <table>
            <thead>
              <tr>
                <th>Project</th>
                <th class="num">Functionality</th>
                <th class="num">Quality</th>
                <th class="num">Innovation</th>
                <th class="num">Total</th>
                <th>Comment</th>
              </tr>
            </thead>
            <tbody id="rows"></tbody>
          </table>
        </div>
      </div>
    </main>

    <footer>
      <div class="shell" style="padding: 0;">
        <a href="/">Gallery</a> &middot;
        <a href="/submit.html">Submit a project</a> &middot;
        API: <code>/api/v1/me/scores</code>
      </div>
    </footer>

    <script>
      const statusEl = document.getElementById("status");
      const contentEl = document.getElementById("content");
      const rowsEl = document.getElementById("rows");

      const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      }[c]));

      function deny(msg) {
        statusEl.classList.add("denied");
        statusEl.innerHTML = esc(msg) + "<br><br>To see a judge view, set the <code>df_sid</code> cookie to a judge session. The seed container prints one on startup.";
      }

      async function load() {
        try {
          const res = await fetch("/api/v1/me/scores", { headers: { Accept: "application/json" } });
          if (res.status === 401) { deny("Not signed in."); return; }
          if (res.status === 403) { deny("You are signed in, but not as a judge for this event."); return; }
          if (!res.ok) throw new Error("HTTP " + res.status);
          const data = await res.json();
          const scores = Array.isArray(data.scores) ? data.scores : [];

          document.getElementById("judge-id").textContent = data.judgeUserId ?? "ÃƒÆ’Ã‚Â¢ÃƒÂ¢Ã¢â‚¬Å¡Ã‚Â¬ÃƒÂ¢Ã¢â€šÂ¬Ã‚Â";
          document.getElementById("count").textContent = String(data.count ?? scores.length);

          if (scores.length) {
            const avg = scores.reduce((a, s) => a + (s.functionality + s.quality + s.innovation) / 3, 0) / scores.length;
            document.getElementById("avg").textContent = avg.toFixed(2);
            document.getElementById("avg").classList.add("ok");
          } else {
            document.getElementById("avg").textContent = "ÃƒÆ’Ã‚Â¢ÃƒÂ¢Ã¢â‚¬Å¡Ã‚Â¬ÃƒÂ¢Ã¢â€šÂ¬Ã‚Â";
          }

          rowsEl.innerHTML = scores.map((s) => {
            const total = s.functionality + s.quality + s.innovation;
            return "<tr>" +
              "<td>" + esc(s.projectId) + "</td>" +
              '<td class="num"><span class="score">' + s.functionality + "</span></td>" +
              '<td class="num"><span class="score">' + s.quality + "</span></td>" +
              '<td class="num"><span class="score">' + s.innovation + "</span></td>" +
              '<td class="num"><strong>' + total + "</strong></td>" +
              "<td>" + esc(s.comment ?? "") + "</td>" +
            "</tr>";
          }).join("");

          statusEl.style.display = "none";
          contentEl.style.display = "block";
        } catch (err) {
          statusEl.classList.add("error");
          statusEl.textContent = "Could not load scores: " + err.message;
        }
      }

      load();
    </script>
  </body>
</html>
