<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Judge view &mdash; Dogfood 2026</title>
    <style>
      :root{--bg:#0a0b14;--surface:rgba(22,24,44,0.75);--surface-2:rgba(32,35,62,0.9);--text:#f4f4ff;--text-2:#b0b6d0;--text-3:#7a8099;--line:rgba(150,160,220,0.10);--line-2:rgba(150,160,220,0.22);--violet:#a78bfa;--cyan:#67e8f9;--pink:#f472b6;--gold:#fbbf24;--accent:#a78bfa;--accent-border:rgba(167,139,250,0.4);--radius:14px;--radius-sm:8px;--ease:cubic-bezier(0.16,1,0.3,1)}
      *,*::before,*::after{box-sizing:border-box}
      html{-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;color-scheme:dark}
      body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Inter','Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.55;min-height:100vh;background-image:radial-gradient(900px 500px at 8% -8%,rgba(167,139,250,0.18),transparent 60%),radial-gradient(900px 600px at 92% 5%,rgba(103,232,249,0.12),transparent 55%),radial-gradient(rgba(167,139,250,0.10) 1px,transparent 1px);background-size:auto,auto,22px 22px;background-attachment:fixed}
      ::selection{background:rgba(167,139,250,0.35);color:var(--text)}
      ::-webkit-scrollbar{width:10px;height:10px}
      ::-webkit-scrollbar-thumb{background:linear-gradient(180deg,var(--violet),var(--cyan));border-radius:5px;border:2px solid var(--bg)}
      .shell{max-width:72rem;margin:0 auto;padding:0 1.75rem}
      header{padding:3.5rem 0 2rem;border-bottom:1px solid var(--line)}
      .brand{display:inline-flex;align-items:center;gap:0.55rem;font-size:0.7rem;letter-spacing:0.2em;text-transform:uppercase;color:var(--text-3);margin-bottom:1.75rem;font-weight:600}
      .brand a{color:var(--text-3);text-decoration:none}
      .brand a:hover{color:var(--violet)}
      .brand .dot{width:7px;height:7px;border-radius:50%;background:linear-gradient(135deg,var(--violet),var(--cyan));box-shadow:0 0 0 4px rgba(167,139,250,0.15),0 0 16px rgba(167,139,250,0.7);animation:pulse 2.4s ease-in-out infinite}
      @keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:0.5;transform:scale(0.8)}}
      h1{font-size:clamp(2rem,3.6vw + 1rem,3rem);font-weight:650;letter-spacing:-0.04em;line-height:1.05;margin:0;background:linear-gradient(120deg,#ffffff 0%,#c4b5fd 35%,#67e8f9 65%,#f472b6 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent}
      .subtitle{color:var(--text-2);margin:1rem 0 0;font-size:1.02rem;max-width:52ch}
      main{padding:2rem 0 3rem}
      .panel{background:linear-gradient(180deg,rgba(30,32,58,0.68) 0%,rgba(18,20,36,0.9) 100%);border:1px solid var(--line);border-radius:var(--radius);padding:1.5rem;margin-bottom:1.25rem;backdrop-filter:blur(8px)}
      .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(11rem,1fr));gap:1rem;padding:1.25rem}
      .kpi{display:flex;flex-direction:column;gap:0.35rem;padding:0.85rem 1rem;background:rgba(11,16,32,0.5);border:1px solid var(--line);border-radius:var(--radius-sm)}
      .kpi .label{font-size:0.7rem;color:var(--text-3);text-transform:uppercase;letter-spacing:0.14em;font-weight:600}
      .kpi .value{font-size:1.5rem;font-weight:650;letter-spacing:-0.02em;font-variant-numeric:tabular-nums}
      .kpi .value.ok{background:linear-gradient(120deg,var(--cyan),var(--violet));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent}
      table{width:100%;border-collapse:collapse;font-size:0.9rem}
      th,td{padding:0.7rem 0.8rem;text-align:left;border-bottom:1px solid var(--line)}
      th{color:var(--text-3);font-weight:600;font-size:0.72rem;text-transform:uppercase;letter-spacing:0.1em}
      tbody tr{transition:background 200ms var(--ease)}
      tbody tr:hover{background:rgba(167,139,250,0.05)}
      tbody tr:last-child td{border-bottom:0}
      .num{text-align:right;font-variant-numeric:tabular-nums}
      .score{display:inline-block;padding:0.15rem 0.5rem;border-radius:6px;background:linear-gradient(135deg,rgba(167,139,250,0.20),rgba(103,232,249,0.10));border:1px solid rgba(167,139,250,0.35);color:#ede9fe;font-variant-numeric:tabular-nums;font-weight:600}
      .status{padding:1rem 1.25rem;border-radius:var(--radius);border:1px solid var(--line);background:linear-gradient(180deg,rgba(30,32,58,0.68) 0%,rgba(18,20,36,0.9) 100%);font-size:0.95rem;color:var(--text-2)}
      .status.error,.status.denied{border-color:rgba(255,141,155,0.4);color:#fca5a5}
      .status.denied code{background:rgba(255,141,155,0.10);border-color:rgba(255,141,155,0.25);color:#fecaca}
      .spinner{display:inline-block;vertical-align:middle;width:13px;height:13px;border:1.5px solid rgba(167,139,250,0.25);border-top-color:var(--violet);border-radius:50%;animation:spin 0.75s linear infinite;margin-right:0.55rem}
      @keyframes spin{to{transform:rotate(360deg)}}
      footer{max-width:72rem;margin:0 auto;padding:1.5rem 1.75rem 2rem;color:var(--text-3);font-size:0.78rem;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:0.6rem;align-items:center}
      footer a{color:var(--text-2);text-decoration:none}
      footer a:hover{color:var(--violet)}
      code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;background:rgba(167,139,250,0.10);border:1px solid rgba(167,139,250,0.22);padding:0.12rem 0.42rem;border-radius:4px;font-size:0.85em;color:#e9d5ff}
    </style>
  </head>
  <body>
    <header>
      <div class="shell">
        <div class="brand"><a href="/">dogfood 2026</a> &middot; judge view</div>
        <h1 id="title">Your scores</h1>
        <p class="subtitle">Signed in via the <code style="background: rgba(122,162,255,0.1); padding: 0.05rem 0.35rem; border-radius: 5px;">df_sid</code> cookie. Only your own scores are visible.</p>
      </div>
    </header>

    <main class="shell">
      <div id="status" class="status"><span class="spinner"></span>Loading your scores&hellip;</div>
      <div id="content" style="display:none;">
        <div class="panel kpis">
          <div class="kpi"><span class="label">Your judge id</span><span class="value" id="judge-id">&mdash;</span></div>
          <div class="kpi"><span class="label">Scores submitted</span><span class="value" id="count">&mdash;</span></div>
          <div class="kpi"><span class="label">Average</span><span class="value" id="avg">&mdash;</span></div>
        </div>
        <div class="panel">
          <table>
            <thead>
              <tr>
                <th>Project</th>
                <th class="num">Functionality</th>
                <th class="num">Quality</th>
                <th class="num">Innovation</th>
                <th class="num">Total</th>
                <th>Comment</th>
              </tr>
            </thead>
            <tbody id="rows"></tbody>
          </table>
        </div>
      </div>
    </main>

    <footer>
      <div class="shell" style="padding: 0;">
        <a href="/">Gallery</a> &middot;
        <a href="/submit.html">Submit a project</a> &middot;
        API: <code>/api/v1/me/scores</code>
      </div>
    </footer>

    <script>
      const statusEl = document.getElementById("status");
      const contentEl = document.getElementById("content");
      const rowsEl = document.getElementById("rows");

      const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      }[c]));

      function deny(msg) {
        statusEl.classList.add("denied");
        statusEl.innerHTML = esc(msg) + "<br><br>To see a judge view, set the <code>df_sid</code> cookie to a judge session. The seed container prints one on startup.";
      }

      async function load() {
        try {
          const res = await fetch("/api/v1/me/scores", { headers: { Accept: "application/json" } });
          if (res.status === 401) { deny("Not signed in."); return; }
          if (res.status === 403) { deny("You are signed in, but not as a judge for this event."); return; }
          if (!res.ok) throw new Error("HTTP " + res.status);
          const data = await res.json();
          const scores = Array.isArray(data.scores) ? data.scores : [];

          document.getElementById("judge-id").textContent = data.judgeUserId ?? "â€”";
          document.getElementById("count").textContent = String(data.count ?? scores.length);

          if (scores.length) {
            const avg = scores.reduce((a, s) => a + (s.functionality + s.quality + s.innovation) / 3, 0) / scores.length;
            document.getElementById("avg").textContent = avg.toFixed(2);
            document.getElementById("avg").classList.add("ok");
          } else {
            document.getElementById("avg").textContent = "â€”";
          }

          rowsEl.innerHTML = scores.map((s) => {
            const total = s.functionality + s.quality + s.innovation;
            return "<tr>" +
              "<td>" + esc(s.projectId) + "</td>" +
              '<td class="num"><span class="score">' + s.functionality + "</span></td>" +
              '<td class="num"><span class="score">' + s.quality + "</span></td>" +
              '<td class="num"><span class="score">' + s.innovation + "</span></td>" +
              '<td class="num"><strong>' + total + "</strong></td>" +
              "<td>" + esc(s.comment ?? "") + "</td>" +
            "</tr>";
          }).join("");

          statusEl.style.display = "none";
          contentEl.style.display = "block";
        } catch (err) {
          statusEl.classList.add("error");
          statusEl.textContent = "Could not load scores: " + err.message;
        }
      }

      load();
    </script>
  </body>
</html>
