<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Judge view | HackRanker</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%231c69d4'/%3E%3Crect x='9' y='9' width='2' height='14' fill='%23ffffff'/%3E%3Crect x='21' y='9' width='2' height='14' fill='%23ffffff'/%3E%3Crect x='9' y='15' width='14' height='2' fill='%23ffffff'/%3E%3C/svg%3E">
    <meta name="description" content="Your own judge scores for HackRanker. Only your own scores are visible.">
    <style>
      :root{
        --bmw-blue:#1c69d4;--bmw-blue-hover:#0653b6;
        --ink:#262626;--body:#3c3c3c;--muted:#757575;--silver:#bbbbbb;
        --hairline:#e6e6e6;--hairline-strong:#cccccc;
        --canvas:#ffffff;--surface-soft:#f7f7f7;
        --dark:#1a2129;--on-dark:#ffffff;--on-dark-soft:#bbbbbb;
        --danger:#c0392b;--success:#1e7d4a;
      }
      *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
      html{-webkit-font-smoothing:antialiased;color-scheme:light}
      body{
        font-family:-apple-system,BlinkMacSystemFont,"Segoe UI Variable Display","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
        background:var(--canvas);color:var(--ink);font-size:16px;line-height:1.55;font-weight:400;
      }
      a{color:var(--bmw-blue);text-decoration:none;transition:color 150ms ease}
      a:hover{color:var(--bmw-blue-hover);text-decoration:underline;text-underline-offset:3px}
      ::selection{background:var(--bmw-blue);color:var(--canvas)}
      ::-webkit-scrollbar{width:12px}
      ::-webkit-scrollbar-track{background:var(--canvas)}
      ::-webkit-scrollbar-thumb{background:var(--hairline-strong)}

      .shell{max-width:1200px;margin:0 auto;padding:0 32px}
      header{padding:0;border-bottom:1px solid var(--hairline);background:var(--canvas)}
      .brand{
        display:inline-flex;align-items:center;gap:10px;
        padding:20px 0;margin:0;
        font-size:13px;font-weight:700;letter-spacing:0.04em;text-transform:uppercase;
        color:var(--ink);
      }
      .brand a{color:var(--ink);text-decoration:none}
      .brand a:hover{color:var(--bmw-blue);text-decoration:none}
      .brand .dot{display:none}
      .brand::before{content:"";width:10px;height:10px;background:var(--bmw-blue);display:block}
      .hero-body{padding:72px 0 56px}
      h1{
        font-size:clamp(36px,4.5vw,56px);
        font-weight:300;line-height:1.05;letter-spacing:-0.01em;
        margin:0 0 20px;color:var(--ink);max-width:16ch;
      }
      .subtitle{color:var(--body);font-size:17px;line-height:1.55;max-width:64ch;margin:0;font-weight:300}
      .subtitle code{
        background:var(--surface-soft);border:1px solid var(--hairline);
        padding:2px 8px;font-size:0.85em;color:var(--ink);
        font-family:ui-monospace,SFMono-Regular,Menlo,monospace;border-radius:0;
      }
      main{padding:0 0 64px}
      .panel{
        background:var(--canvas);
        border:1px solid var(--hairline);
        padding:0;
        margin-bottom:32px;
        border-radius:0;
      }
      .kpis{
        display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
        gap:0;padding:0;margin-bottom:32px;border:1px solid var(--hairline);
      }
      .kpi{
        display:flex;flex-direction:column;gap:6px;
        padding:28px 32px;
        background:var(--canvas);
        border-right:1px solid var(--hairline);
        border-radius:0;
      }
      .kpi:last-child{border-right:0}
      .kpi .label{
        font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:0.08em;font-weight:600;
      }
      .kpi .value{
        font-size:32px;font-weight:300;letter-spacing:-0.02em;
        font-variant-numeric:tabular-nums;color:var(--ink);line-height:1.1;
      }
      .kpi .value.ok{color:var(--ink)}

      table{width:100%;border-collapse:collapse;font-size:15px;background:var(--canvas)}
      th,td{padding:18px 24px;text-align:left;border-bottom:1px solid var(--hairline)}
      th{
        color:var(--muted);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:0.08em;
        background:var(--surface-soft);
      }
      tbody tr:last-child td{border-bottom:0}
      tbody tr:hover{background:var(--surface-soft)}
      .num{text-align:right;font-variant-numeric:tabular-nums}
      .score{
        display:inline-block;padding:4px 10px;
        background:var(--canvas);border:1px solid var(--hairline-strong);
        color:var(--ink);font-variant-numeric:tabular-nums;font-weight:500;font-size:14px;
        border-radius:0;
      }
      .status{
        padding:32px;border:1px solid var(--hairline);background:var(--canvas);
        font-size:15px;color:var(--body);font-weight:300;border-radius:0;
      }
      .status.error,.status.denied{border-left:3px solid var(--danger);color:var(--danger)}
      .status.denied code{
        background:#fdf2f2;border-color:#f5d0d0;color:var(--danger);
      }
      .spinner{
        display:inline-block;vertical-align:middle;
        width:12px;height:12px;
        border:2px solid var(--hairline-strong);border-top-color:var(--bmw-blue);
        border-radius:50%;animation:spin 700ms linear infinite;margin-right:10px;
      }
      @keyframes spin{to{transform:rotate(360deg)}}

      footer{
        background:var(--dark);color:var(--on-dark-soft);
        padding:40px 0;font-size:13px;letter-spacing:0.02em;
        display:flex;flex-wrap:wrap;gap:32px;align-items:center;
      }
      footer .shell{display:flex;flex-wrap:wrap;gap:32px;align-items:center;width:100%;padding-left:32px;padding-right:32px;margin:0 auto;max-width:1200px}
      footer a{color:var(--on-dark);text-decoration:none;text-transform:uppercase;font-size:12px;letter-spacing:0.08em;font-weight:500}
      footer a:hover{color:var(--bmw-blue);text-decoration:none}
      code{
        font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
        background:var(--surface-soft);border:1px solid var(--hairline);
        padding:2px 8px;font-size:0.85em;color:var(--ink);border-radius:0;
      }

      @media(max-width:768px){
        .shell{padding-left:20px;padding-right:20px}
        footer .shell{padding-left:20px;padding-right:20px}
        .hero-body{padding:48px 0 40px}
        h1{font-size:32px}
        .kpi{padding:20px 24px}
        .kpi .value{font-size:24px}
        th,td{padding:14px 16px;font-size:14px}
        .status{padding:24px}
        footer{padding:32px 0}
      }
.brand-row{display:flex;align-items:center;justify-content:space-between;padding:20px 0}
.brand-row .brand{padding:0}
.top-signin{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:0.06em;color:var(--bmw-blue);text-decoration:none;transition:color 150ms ease}
.top-signin:hover{color:var(--bmw-blue-hover);text-decoration:underline;text-underline-offset:3px}
    </style>
  </head>
  <body>
    <header>
      <div class="shell">
        <div class="brand-row"><div class="brand"><a href="/">HackRanker</a> &middot; judge view</div></div><a class="top-signin" href="/login.html">Sign in</a></div>
        <h1 id="title">Your scores</h1>
        <p class="subtitle">Signed in via the <code style="background: rgba(122,162,255,0.1); padding: 0.05rem 0.35rem; border-radius: 5px;">df_sid</code> cookie. Only your own scores are visible.</p>
      </div>
    </header>

    <main class="shell">
      <div id="status" class="status"><span class="spinner"></span>Loading your scores&hellip;</div>
      <div id="content" style="display:none;">
        <div class="panel kpis">
          <div class="kpi"><span class="label">Your judge id</span><span class="value" id="judge-id">&mdash;</span></div>
          <div class="kpi"><span class="label">Scores submitted</span><span class="value" id="count">&mdash;</span></div>
          <div class="kpi"><span class="label">Average</span><span class="value" id="avg">&mdash;</span></div>
        </div>
        <div class="panel">
          <table>
            <thead>
              <tr>
                <th>Project</th>
                <th class="num">Functionality</th>
                <th class="num">Quality</th>
                <th class="num">Innovation</th>
                <th class="num">Total</th>
                <th>Comment</th>
              </tr>
            </thead>
            <tbody id="rows"></tbody>
          </table>
        </div>
      </div>
    </main>

    <footer>
      <div class="shell" style="padding: 0;">
        <a href="/">Gallery</a> &middot;
        <a href="/submit.html">Submit a project</a> &middot;
        API: <code>/api/v1/me/scores</code>
      </div>
    </footer>

    <script>

      const contentEl = document.getElementById("content");
      const rowsEl = document.getElementById("rows");

        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"

      function deny(msg) {
        statusEl.classList.add("denied");
        statusEl.innerHTML = esc(msg) + "<br><br>To see a judge view, set the <code>df_sid</code> cookie to a judge session. The seed container prints one on startup.";
      }

Ãƒâ€šÃ‚Â¡ÃƒÆ’Ã†â€™Ãƒâ€ Ã¢â‚¬â„¢ÃƒÆ’Ã‚Â¢ÃƒÂ¢Ã¢â‚¬Å¡Ã‚Â¬Ãƒâ€¦Ã‚Â¡ÃƒÆ’Ã†â€™ÃƒÂ¢Ã¢â€šÂ¬Ã…Â¡ÃƒÆ’Ã¢â‚¬Å¡Ãƒâ€šÃ‚Â";
          document.getElementById("count").textContent = String(data.count ?? scores.length);

          if (scores.length) {
            const avg = scores.reduce((a, s) => a + (s.functionality + s.quality + s.innovation) / 3, 0) / scores.length;
            document.getElementById("avg").textContent = avg.toFixed(2);
