<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dogfood 2026 &mdash; Sample Hack 2026</title>
    <style>
      :root {
        --bg: #f8fafc;
        --fg: #0f172a;
        --muted: #64748b;
        --line: #e2e8f0;
        --accent: #047857;
        --accent-soft: #ecfdf5;
      }
      * { box-sizing: border-box; }
      body {
        font-family: system-ui, -apple-system, Segoe UI, sans-serif;
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        line-height: 1.5;
      }
      header {
        max-width: 72rem;
        margin: 0 auto;
        padding: 2rem 1.5rem 1rem;
        border-bottom: 1px solid var(--line);
      }
      header h1 {
        margin: 0 0 0.25rem;
        letter-spacing: -0.02em;
        font-size: 1.75rem;
      }
      header p {
        margin: 0;
        color: var(--muted);
        font-size: 0.95rem;
      }
      header .meta {
        margin-top: 0.75rem;
        display: flex;
        gap: 1.5rem;
        flex-wrap: wrap;
        font-size: 0.875rem;
        color: var(--muted);
      }
      header .meta strong { color: var(--fg); font-weight: 600; }
      main {
        max-width: 72rem;
        margin: 0 auto;
        padding: 1.5rem;
      }
      #status {
        padding: 0.75rem 1rem;
        background: var(--accent-soft);
        border: 1px solid #a7f3d0;
        color: var(--accent);
        border-radius: 8px;
        font-size: 0.9rem;
      }
      #status.error {
        background: #fef2f2;
        border-color: #fecaca;
        color: #b91c1c;
      }
      #gallery {
        margin-top: 1.5rem;
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(19rem, 1fr));
        gap: 1rem;
      }
      .card {
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 1rem 1.125rem;
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
        transition: border-color 0.12s ease, transform 0.12s ease;
      }
      .card:hover {
        border-color: #94a3b8;
        transform: translateY(-1px);
      }
      .card h2 {
        margin: 0;
        font-size: 1.05rem;
        letter-spacing: -0.01em;
      }
      .card p {
        margin: 0;
        font-size: 0.9rem;
        color: var(--muted);
      }
      .card .row {
        display: flex;
        gap: 0.5rem;
        flex-wrap: wrap;
        font-size: 0.8rem;
        margin-top: auto;
      }
      .tag {
        background: #f1f5f9;
        color: #334155;
        padding: 0.125rem 0.5rem;
        border-radius: 999px;
        font-weight: 500;
      }
      .tag.track { background: #eff6ff; color: #1d4ed8; }
      .card a {
        color: var(--accent);
        text-decoration: none;
        font-size: 0.85rem;
        font-weight: 500;
      }
      .card a:hover { text-decoration: underline; }
      footer {
        max-width: 72rem;
        margin: 2rem auto 3rem;
        padding: 0 1.5rem;
        color: var(--muted);
        font-size: 0.8rem;
      }
      code {
        background: #f1f5f9;
        padding: 0.1rem 0.35rem;
        border-radius: 4px;
        font-size: 0.85em;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Dogfood 2026</h1>
      <p>Public gallery &mdash; Sample Hack 2026</p>
      <div class="meta">
        <span><strong id="event-name">&mdash;</strong></span>
        <span>Submissions close <strong id="event-close">&mdash;</strong></span>
        <span><strong id="project-count">&mdash;</strong> projects</span>
      </div>
    </header>
    <main>
      <div id="status">Loading gallery&hellip;</div>
      <section id="gallery" aria-live="polite"></section>
    </main>
    <footer>
      API: <code>/api/v1/events/evt_01/gallery</code> &middot;
      Health: <a href="/api/healthz">/api/healthz</a> &middot;
      Export: <code>/api/v1/events/evt_01/export.csv</code> (organizer only)
    </footer>
    <script>
      const EVENT_ID = "evt_01";
      const statusEl = document.getElementById("status");
      const galleryEl = document.getElementById("gallery");

      function fmtDate(iso) {
        if (!iso) return "\u2014";
        const d = new Date(iso);
        if (Number.isNaN(d.getTime())) return "\u2014";
        return d.toLocaleDateString(undefined, { year: "numeric", month: "short", day: "numeric" });
      }

      function escapeHtml(s) {
        return String(s ?? "").replace(/[&<>"']/g, (c) => ({
          "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
        }[c]));
      }

      function renderCard(p) {
        const repo = p.repoUrl
          ? `<a href="${escapeHtml(p.repoUrl)}" target="_blank" rel="noopener">Repository &rarr;</a>`
          : "";
        return `
          <article class="card">
            <h2>${escapeHtml(p.title)}</h2>
            <p>${escapeHtml(p.summary ?? "")}</p>
            <div class="row">
              <span class="tag track">${escapeHtml(p.track?.name ?? "Unassigned")}</span>
              <span class="tag">${escapeHtml(p.team?.name ?? "Unknown team")}</span>
              <span class="tag">${fmtDate(p.submittedAt)}</span>
            </div>
            ${repo}
          </article>
        `;
      }

      async function load() {
        try {
          const res = await fetch(`/api/v1/events/${EVENT_ID}/gallery`, {
            headers: { Accept: "application/json" },
          });
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          const data = await res.json();

          document.getElementById("event-name").textContent = data.event?.name ?? EVENT_ID;
          document.getElementById("event-close").textContent = fmtDate(data.event?.submissionsClose);
          document.getElementById("project-count").textContent = String(data.count ?? data.items?.length ?? 0);

          statusEl.textContent = `Showing ${data.count ?? 0} projects.`;
          statusEl.classList.remove("error");

          galleryEl.innerHTML = (data.items ?? []).map(renderCard).join("");
        } catch (err) {
          statusEl.textContent = `Could not load gallery: ${err.message}`;
          statusEl.classList.add("error");
        }
      }

      load();
    </script>
  </body>
</html>
