<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Not found | Sample Hack 2026</title>
    <meta name="description" content="The page you requested does not exist.">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230b0b0c'/%3E%3Crect x='9' y='9' width='14' height='14' rx='2' fill='none' stroke='%23ededef' stroke-width='2'/%3E%3C/svg%3E">
    <style>
      :root{--bg:#0b0b0c;--surface:#131315;--surface-2:#1a1a1d;--border:#242428;--text:#ededef;--text-muted:#9a9aa0;--text-dim:#6a6a72;--accent:#3b82f6;--radius:6px;--radius-sm:4px}
      *,*::before,*::after{box-sizing:border-box}
      html{-webkit-font-smoothing:antialiased;color-scheme:dark}
      body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:15px;line-height:1.55;min-height:100vh;display:flex;flex-direction:column}
      a{color:var(--accent);text-decoration:none}
      a:hover{text-decoration:underline;text-underline-offset:2px}
      ::selection{background:rgba(59,130,246,0.25)}
      .shell{max-width:720px;margin:0 auto;padding:0 32px}
      main{flex:1;display:flex;align-items:center;padding:64px 0}
      .code{font-size:13px;color:var(--text-dim);letter-spacing:0.08em;text-transform:uppercase;font-weight:500;margin-bottom:12px}
      h1{font-size:32px;font-weight:600;letter-spacing:-0.02em;line-height:1.15;margin:0 0 12px;color:var(--text)}
      p{color:var(--text-muted);margin:0 0 24px;font-size:15px;max-width:52ch}
      .actions{display:flex;flex-wrap:wrap;gap:8px}
      .btn{display:inline-flex;align-items:center;padding:8px 14px;font-size:14px;font-weight:500;color:var(--text-muted);background:transparent;border:1px solid var(--border);border-radius:var(--radius-sm);text-decoration:none;transition:color 120ms ease,border-color 120ms ease,background 120ms ease}
      .btn:hover{color:var(--text);border-color:var(--border);background:var(--surface);text-decoration:none}
      footer{padding:32px 0;color:var(--text-dim);font-size:12px;border-top:1px solid var(--border)}
      @media (max-width:640px){.shell{padding-left:20px;padding-right:20px}h1{font-size:24px}}
    </style>
  </head>
  <body>
    <main>
      <div class="shell" style="width:100%;">
        <div class="code">404</div>
        <h1>Page not found</h1>
        <p>The page you requested does not exist. It may have been moved, or you may have followed a broken link.</p>
        <div class="actions">
          <a class="btn" href="/">Project gallery</a>
          <a class="btn" href="/judge.html">Judge view</a>
          <a class="btn" href="/status.html">Status</a>
        </div>
      </div>
    </main>
    <footer>
      <div class="shell">
        <a href="/" style="color:var(--text-muted);">Sample Hack 2026</a>
      </div>
    </footer>
  </body>
</html>
