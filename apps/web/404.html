<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Not found | Sample Hack 2026</title>
    <meta name="description" content="The page you requested does not exist.">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%231c69d4'/%3E%3Crect x='9' y='9' width='14' height='14' fill='%23ffffff'/%3E%3C/svg%3E">
    <style>
      :root{
        --bmw-blue:#1c69d4;--bmw-blue-hover:#0653b6;
        --ink:#262626;--body:#3c3c3c;--muted:#757575;--silver:#bbbbbb;
        --hairline:#e6e6e6;--hairline-strong:#cccccc;
        --canvas:#ffffff;--surface-soft:#f7f7f7;
        --dark:#1a2129;--on-dark:#ffffff;--on-dark-soft:#bbbbbb;
      }
      *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
      html{-webkit-font-smoothing:antialiased;color-scheme:light}
      body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI Variable Display","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background:var(--canvas);color:var(--ink);font-size:16px;line-height:1.55;font-weight:400;min-height:100vh;display:flex;flex-direction:column}
      a{color:var(--bmw-blue);text-decoration:none;transition:color 150ms ease}
      a:hover{color:var(--bmw-blue-hover);text-decoration:underline;text-underline-offset:3px}
      ::selection{background:var(--bmw-blue);color:var(--canvas)}
      ::-webkit-scrollbar{width:12px}
      ::-webkit-scrollbar-track{background:var(--canvas)}
      ::-webkit-scrollbar-thumb{background:var(--hairline-strong)}
      .shell{max-width:720px;margin:0 auto;padding:0 32px}
      main{flex:1;display:flex;align-items:center;padding:96px 0}
      .code{font-size:13px;color:var(--muted);letter-spacing:0.12em;text-transform:uppercase;font-weight:600;margin-bottom:24px}
      h1{font-size:clamp(40px,5vw,64px);font-weight:300;line-height:1.05;letter-spacing:-0.015em;margin:0 0 20px;color:var(--ink)}
      p{color:var(--body);margin:0 0 40px;font-size:17px;line-height:1.6;max-width:52ch;font-weight:300}
      .actions{display:flex;flex-wrap:wrap;gap:0}
      .btn{display:inline-flex;align-items:center;padding:16px 24px;font-size:13px;font-weight:600;color:var(--ink);background:transparent;border:1px solid var(--hairline-strong);border-radius:0;text-decoration:none;transition:color 150ms ease,background 150ms ease,border-color 150ms ease;text-transform:uppercase;letter-spacing:0.06em;margin-left:-1px}
      .btn:first-child{margin-left:0}
      .btn:hover{color:var(--canvas);background:var(--bmw-blue);border-color:var(--bmw-blue);text-decoration:none}
      footer{background:var(--dark);color:var(--on-dark-soft);padding:40px 0;font-size:13px;letter-spacing:0.02em}
      footer .shell{display:flex;flex-wrap:wrap;gap:32px;align-items:center;max-width:720px;margin:0 auto}
      footer a{color:var(--on-dark);text-decoration:none;text-transform:uppercase;font-size:12px;letter-spacing:0.08em;font-weight:500}
      footer a:hover{color:var(--bmw-blue);text-decoration:none}
      @media(max-width:768px){
        .shell{padding-left:20px;padding-right:20px}
        h1{font-size:36px}
        main{padding:64px 0}
        .actions{flex-direction:column}
        .btn{margin-left:0;margin-top:-1px;justify-content:center}
        footer{padding:32px 0}
      }
    </style>
  </head>
  <body>
    <main>
      <div class="shell" style="width:100%;">
        <div class="code">404</div>
        <h1>Page not found</h1>
        <p>The page you requested does not exist. It may have been moved, or you may have followed a broken link.</p>
        <div class="actions">
          <a class="btn" href="/">Project gallery</a>
          <a class="btn" href="/judge.html">Judge view</a>
          <a class="btn" href="/status.html">Status</a>
        </div>
      </div>
    </main>
    <footer>
      <div class="shell">
        <a href="/" style="color:var(--text-muted);">Sample Hack 2026</a>
      </div>
    </footer>
  </body>
</html>
