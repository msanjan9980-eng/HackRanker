name: dogfood-2026

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dogfood
      POSTGRES_PASSWORD: dogfood
      POSTGRES_DB: dogfood
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dogfood -d dogfood"]
      interval: 3s
      timeout: 3s
      retries: 30

  seed:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ["sh", "-c", "echo 'seed: placeholder, will be implemented next batch'"]
    environment:
      NODE_ENV: production
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgres://dogfood:dogfood@db:5432/dogfood
      NODE_ENV: production
      APP_ORIGIN: http://localhost:8080
      SESSION_SECRET: dev-only-change-me-please-32-bytes-minimum
    depends_on:
      db:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20
    expose:
      - "3000"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata: